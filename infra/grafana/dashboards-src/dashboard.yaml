apiVersion: 1

providers:
  - name: EMS Common
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/common
      foldersFromFilesStructure: true

  - name: EMS Custom
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/custom
      foldersFromFilesStructure: true
