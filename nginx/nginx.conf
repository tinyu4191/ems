server {
    listen 80;
    server_name _;

    # Docker 內建 DNS，讓下面的 proxy_pass 每次都重新解析 grafana/api 的實際 IP，
    # 而不是只在 nginx 啟動當下解析一次、之後一直快取舊 IP。
    # 這是 2026-09-30 ECI 部署後出現的問題：deploy-site.sh 重建 api 容器換了新 IP，
    # nginx 沒有跟著重啟，手上還握著舊 IP，轉發全部變成 502。
    # valid=10s：DNS 快取 10 秒，容器重建通常間隔遠大於這個時間，不影響效能。
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Grafana 反向代理
    # 注意：Grafana 端已設定 GF_SERVER_SERVE_FROM_SUB_PATH=true 對應這個 /grafana/ 路徑
    location /grafana/ {
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Fastify API 反向代理
    location /api/ {
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
