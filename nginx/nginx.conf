server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA：找不到實體檔案就 fallback 回 index.html，交給前端 router 處理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Grafana 反向代理
    # 注意：Grafana 端已設定 GF_SERVER_SERVE_FROM_SUB_PATH=true 對應這個 /grafana/ 路徑
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Fastify API 佔位 —— 骨架完成前先回 503，之後把 return 503 換成 proxy_pass
    location /api/ {
        return 503 "API not yet deployed\n";
    }
}
